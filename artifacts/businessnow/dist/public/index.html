  <body>
    <script>
      /* Screenshot-session bootstrap — sets auth from URL params so headless
         tools can capture authenticated pages without interactive login.
         Usage: append ?ss=1 (optionally &uid=N&role=ROLE) to any route.
         This block runs before React mounts so CurrentUserProvider rehydrates. */
      (function () {
        var p = new URLSearchParams(window.location.search);
        if (p.get('ss') === '1') {
          var uid  = p.get('uid')  || '1';
          var role = p.get('role') || 'account_admin';
          localStorage.setItem('activeUserId', uid);
          localStorage.setItem('activeRole',   role);
        }
      })();
    </script>
    <div id="root"></div>
  </body>
